name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── キャッシュ設定 ──────────────────────────────────────────
      # .buildozer_global/ = SDK・NDK の実際の保存先（2〜4GB）
      # .buildozer/        = ビルド成果物・ライブラリ（2GB前後）
      # ※ python-for-android はキャッシュしない（毎回 git clone）
      - name: Cache buildozer_global (SDK / NDK)
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-sdk-${{ hashFiles('buildozer.spec') }}-v1

      - name: Cache .buildozer (build artifacts)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}-v4

      # ── キャッシュ復元後に p4a をディレクトリごと削除 ─────────
      # .git だけの削除では親リポジトリの .git を参照して失敗するため
      # ディレクトリごと削除し buildozer に git clone させる
      - name: Remove p4a to force fresh clone (post-cache-restore)
        run: |
          rm -rf .buildozer/android/platform/python-for-android
          echo "[fix] Removed p4a — will be freshly cloned by buildozer"

      # ── buildozer-action のパッチ ───────────────────────────────
      - name: Checkout patched buildozer-action
        uses: actions/checkout@v4
        with:
          repository: ArtemSBulgakov/buildozer-action
          ref: v1
          path: buildozer-action-patched

      - name: Remove broken openjdk-r PPA line
        run: sed -i '/add-apt-repository ppa:openjdk-r\/ppa/d' buildozer-action-patched/Dockerfile

      - name: Ensure buildozer 'user' account exists
        run: |
          cat > /tmp/ensure_user.txt << 'EOF'
          RUN if ! id -u user >/dev/null 2>&1; then sudo useradd --create-home --shell /bin/bash user && sudo usermod --append --groups sudo user && echo "user ALL=(ALL) NOPASSWD: ALL" | sudo tee -a /etc/sudoers >/dev/null; fi
          EOF
          sed -i '1r /tmp/ensure_user.txt' buildozer-action-patched/Dockerfile

      - name: Work around pip/apt conflicts on the new base image
        run: |
          sed -i '1a ENV PIP_BREAK_SYSTEM_PACKAGES=1' buildozer-action-patched/Dockerfile
          sed -i '1a ENV PIP_IGNORE_INSTALLED=1' buildozer-action-patched/Dockerfile

      - name: Auto-accept Android SDK licenses
        run: |
          if grep -q '^#\?android\.accept_sdk_license' buildozer.spec; then
            sed -i 's/^#\?android\.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo 'android.accept_sdk_license = True' >> buildozer.spec
          fi

      - name: Pin target Python to 3.14.7
        run: sed -i 's/^requirements = python3,/requirements = python3==3.14.7,hostpython3==3.14.7,/' buildozer.spec

      # ── patch シム ─────────────────────────────────────────────
      - name: "Shim: skip armv7l patch / disable _remote_debugging / stub pwritev+preadv"
        run: |
          mkdir -p patch-shim
          cat > patch-shim/patch << 'SHIM_EOF'
          #!/bin/sh
          build_dir=""
          prev=""
          for a in "$@"; do
            if [ "$prev" = "-d" ]; then build_dir="$a"; fi
            prev="$a"
          done
          if [ -n "$build_dir" ] && [ -d "$build_dir/Modules" ]; then
            setup_local="$build_dir/Modules/Setup.local"
            if ! grep -q '^\*disabled\*' "$setup_local" 2>/dev/null; then
              printf '*disabled*\n_remote_debugging\ngrp\n' >> "$setup_local"
            fi
            STUB='/* [build-shim] Android API<24: stub pwritev/preadv */
          #if defined(__ANDROID_API__) && (__ANDROID_API__ < 24)
          #  ifndef pwritev
          #    define pwritev(fd, iov, n, off) (-1)
          #  endif
          #  ifndef preadv
          #    define preadv(fd, iov, n, off) (-1)
          #  endif
          #endif'
            for f in "$build_dir/Python/remote_debugging.c" "$build_dir/Python/remote_debug.h"; do
              if [ -f "$f" ] && ! grep -q 'build-shim.*stub pwritev' "$f" 2>/dev/null; then
                printf '%s\n' "$STUB" > /tmp/_shim_prepend.tmp
                cat "$f" >> /tmp/_shim_prepend.tmp
                mv /tmp/_shim_prepend.tmp "$f"
              fi
            done
          fi
          for a in "$@"; do
            case "$a" in
              *3.14_armv7l_fix.patch*)
                echo "[shim] Skipping 3.14_armv7l_fix.patch"
                exit 0
                ;;
            esac
          done
          exec /usr/bin/patch "$@"
          SHIM_EOF
          chmod +x patch-shim/patch

      - name: Write CONFIG_SITE
        run: |
          mkdir -p patches
          cat > patches/android-config.site << 'SITE_EOF'
          ac_cv_func_getgrgid=no
          SITE_EOF

      # ── ビルド ─────────────────────────────────────────────────
      # buildozer が SDK/NDK を .buildozer_global/ にダウンロードした後、
      # platforms;android-34 が入っていなければ sdkmanager でインストールし、
      # 再度ビルドを試みる（初回のみ2回実行、2回目以降はキャッシュで1回で成功）
      - name: Build with Buildozer
        uses: ./buildozer-action-patched
        id: buildozer
        env:
          CONFIG_SITE: /github/workspace/patches/android-config.site
        with:
          workdir: .
          buildozer_version: stable
          command: |
            set -e
            export PATH=/github/workspace/patch-shim:$PATH

            # SDK platform インストール関数（sdkmanager が存在する場合のみ実行）
            install_sdk_platform() {
              local sdk_base="/github/workspace/.buildozer_global/android/platform/android-sdk"
              local platform_dir="$sdk_base/platforms/android-34"
              if [ -d "$platform_dir" ]; then
                echo "[sdk] platforms;android-34 は既にインストール済み"
                return 0
              fi
              for sdkm in \
                "$sdk_base/tools/bin/sdkmanager" \
                "$sdk_base/cmdline-tools/latest/bin/sdkmanager" \
                "$sdk_base/cmdline-tools/bin/sdkmanager"; do
                if [ -f "$sdkm" ]; then
                  echo "[sdk] sdkmanager 発見: $sdkm → platforms;android-34 をインストール"
                  yes | "$sdkm" --licenses > /dev/null 2>&1 || true
                  yes | "$sdkm" "platforms;android-34" "build-tools;34.0.0"
                  return 0
                fi
              done
              echo "[sdk] sdkmanager 未発見（SDK 未ダウンロード）"
              return 1
            }

            # キャッシュから SDK がある場合は先にプラットフォームをインストール
            install_sdk_platform || true

            # ビルド実行（初回は SDK/NDK ダウンロードで時間がかかる）
            if yes | buildozer android debug; then
              echo "[build] ビルド成功"
            else
              echo "[build] 1回目失敗 → SDK platform をインストールして再試行"
              install_sdk_platform
              yes | buildozer android debug
            fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhxx-rng-tool-apk
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
