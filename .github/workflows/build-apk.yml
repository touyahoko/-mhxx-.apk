name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android SDK/NDK の初回ダウンロードが数GB・数十分かかるため、
      # .buildozer をキャッシュして2回目以降のビルドを高速化する。
      # (patches/ の内容が変わったら、以前の失敗ビルドの中間生成物を
      #  引きずらないようキャッシュキーも変える)
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec', 'patches/**') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec', 'patches/**') }}
          restore-keys: |
            buildozer-local-

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        env:
          # CPythonのconfigureに「getgrgidも無い」と判定させ、Androidの
          # Bionic libcでは未対応の grp モジュール (grpmodule.c) の
          # ビルドをスキップさせる。詳細は patches/android-config.site
          # 参照。autoconfの標準機構 (CONFIG_SITE) なので、python3以外の
          # レシピのビルドには影響しない。
          CONFIG_SITE: ${{ github.workspace }}/patches/android-config.site
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhxx-rng-tool-apk
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
